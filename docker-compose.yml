services:
 django:
  build: ./django_app
  ports: ["8001:8001"]
  environment: {DB_NAME: helpdesk, DB_USER: helpdesk, DB_PASSWORD: helpdesk, DB_HOST: postgres, FASTAPI_URL: http://fastapi:8000}
  depends_on: [postgres, fastapi]
 fastapi:
  build: ./fastapi_service
  ports: ["8000:8000"]
  environment: {DATABASE_URL: postgresql+asyncpg://helpdesk:helpdesk@postgres:5432/sla_db}
  depends_on: [postgres]
 postgres:
  image: postgres:16
  environment: {POSTGRES_USER: helpdesk, POSTGRES_PASSWORD: helpdesk, POSTGRES_DB: helpdesk}
  ports: ["5432:5432"]
  volumes: [pgdata:/var/lib/postgresql/data]
 redis:
  image: redis:7-alpine
  ports: ["6379:6379"]
 nginx:
  image: nginx:alpine
  ports: ["80:80"]
  volumes: [./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro]
  depends_on: [django,fastapi]
volumes: {pgdata:}
